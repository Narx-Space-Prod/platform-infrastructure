name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/workflows.yml@f907416baf6ffca41626f10df94f7631d86de8c0
  terraform:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/terraform.yml@6e58479d8ce607e66411750d046f314c8a4e4534
    with:
      working-directory: bootstrap
  registry:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/terraform.yml@6e58479d8ce607e66411750d046f314c8a4e4534
    with:
      working-directory: delivery
  local:
    name: Local bootstrap syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m py_compile local/bootstrap.py
      - run: python3 -m unittest discover -s tests -p test_local_notifications.py -v
