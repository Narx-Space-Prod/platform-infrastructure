name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/workflows.yml@4445455dd22c076a27b1bb35d46f645d354ade05
  terraform:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/terraform.yml@4445455dd22c076a27b1bb35d46f645d354ade05
    with:
      working-directory: bootstrap
  registry:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/terraform.yml@4445455dd22c076a27b1bb35d46f645d354ade05
    with:
      working-directory: delivery
  local:
    name: Local bootstrap checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python3 -m py_compile local/bootstrap.py local/observability.py
      - name: Set up Helm for bootstrap networking validation
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.22.0
      - name: Validate checksum-pinned Cilium configuration without installing
        run: |
          helm pull oci://quay.io/cilium/charts/cilium --version 1.20.4 --destination "$RUNNER_TEMP"
          printf '%s  %s\n' \
            505abff8385811df1a949776fc42e9f10697989a332acc86d6e8933efcb855ed \
            "$RUNNER_TEMP/cilium-1.20.4.tgz" | sha256sum --check --strict
          helm lint --strict "$RUNNER_TEMP/cilium-1.20.4.tgz" -f local/cilium-values.yaml
          helm template cilium "$RUNNER_TEMP/cilium-1.20.4.tgz" -n kube-system \
            --kube-version 1.34.0 -f local/cilium-values.yaml > "$RUNNER_TEMP/cilium.yaml"
      - name: Read immutable Narx monitoring integration data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Narx-Space-Prod/platform-gitops
          ref: 31ed51edcb47870f91e09a826627cf3d8330141b
          path: narx-monitoring-data
          persist-credentials: false
      - name: Render checksum-pinned platform charts without installing
        run: |
          python3 local/observability.py --context kind-narx-commerce \
            --integration-values narx-monitoring-data/monitoring/local-values.yaml \
            --cache "$RUNNER_TEMP/narx-platform-charts" \
            --render-dir "$RUNNER_TEMP/narx-platform-render"
      - name: Verify bootstrap and rendered platform contracts
        env:
          NARX_PLATFORM_RENDER_DIR: ${{ runner.temp }}/narx-platform-render
        run: python3 -m unittest discover -s tests -p 'test_local_*.py' -v
