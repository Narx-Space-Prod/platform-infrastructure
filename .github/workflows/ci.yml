name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/workflows.yml@f907416baf6ffca41626f10df94f7631d86de8c0
  terraform:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/terraform.yml@6e58479d8ce607e66411750d046f314c8a4e4534
    with:
      working-directory: bootstrap
  registry:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/terraform.yml@6e58479d8ce607e66411750d046f314c8a4e4534
    with:
      working-directory: delivery
  local:
    name: Local bootstrap checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m py_compile local/bootstrap.py
      - run: python3 -m unittest discover -s tests -p 'test_local_*.py' -v
      - name: Set up Helm for bootstrap networking validation
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.22.0
      - name: Validate checksum-pinned Cilium configuration without installing
        run: |
          helm pull oci://quay.io/cilium/charts/cilium --version 1.20.4 --destination "$RUNNER_TEMP"
          printf '%s  %s\n' \
            505abff8385811df1a949776fc42e9f10697989a332acc86d6e8933efcb855ed \
            "$RUNNER_TEMP/cilium-1.20.4.tgz" | sha256sum --check --strict
          helm lint --strict "$RUNNER_TEMP/cilium-1.20.4.tgz" -f local/cilium-values.yaml
          helm template cilium "$RUNNER_TEMP/cilium-1.20.4.tgz" -n kube-system \
            --kube-version 1.34.0 -f local/cilium-values.yaml > "$RUNNER_TEMP/cilium.yaml"
