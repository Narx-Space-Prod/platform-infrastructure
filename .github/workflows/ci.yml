name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/workflows.yml@e94e5e70af3edaf124cd7fbe86ec76f36160fdbf
  terraform:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/terraform.yml@e94e5e70af3edaf124cd7fbe86ec76f36160fdbf
    with:
      working-directory: bootstrap
