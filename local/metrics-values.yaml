fullnameOverride: narx-metrics-server
replicas: 1
tls:
  type: helm
apiService:
  insecureSkipTLSVerify: false
args:
- --kubelet-insecure-tls
resources:
  requests:
    cpu: 100m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi

# Keep the autoscaling API stable during laptop startup and brief host stalls.
# Readiness still fails when metrics are unavailable; health is not overridden.
livenessProbe:
  initialDelaySeconds: 120
  timeoutSeconds: 5
readinessProbe:
  timeoutSeconds: 5
