fullnameOverride: narx-monitoring
defaultRules:
  create: true
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
prometheusOperator:
  podLabels: &id001
    narx.space/kubernetes-api-access: 'true'
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 192Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 48Mi
  networkPolicy:
    enabled: true
    flavor: cilium
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 200m
          memory: 96Mi
prometheus:
  prometheusSpec:
    externalUrl: https://narx-prometheus.narx.space
    replicas: 1
    retention: 6h
    retentionSize: 1GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    externalLabels:
      project: narx-commerce
    podMetadata:
      labels:
        narx.space/kubernetes-api-access: 'true'
        narx.space/kubelet-access: 'true'
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 600m
        memory: 448Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: 'null'
      group_by:
      - alertname
      - environment
      - namespace
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 4h
      routes:
      - receiver: narx-slack
        matchers:
        - project="narx-commerce"
        - severity=~"warning|critical"
    receivers:
    - name: 'null'
    - name: narx-slack
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/narx-monitoring-slack/webhook-url
        send_resolved: true
        title: 'Narx {{ .Status }}: {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}

          {{ end }}'
  alertmanagerSpec:
    externalUrl: https://narx-alerts.narx.space
    replicas: 1
    secrets:
    - narx-monitoring-slack
    automountServiceAccountToken: false
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 96Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
grafana:
  grafana.ini:
    server:
      domain: narx-grafana.narx.space
      root_url: https://narx-grafana.narx.space
    security:
      cookie_secure: true
  admin:
    existingSecret: narx-monitoring-grafana
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsEnabled: false
  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: false
  rbac:
    create: false
  automountServiceAccountToken: false
  initChownData:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  persistence:
    enabled: true
    storageClassName: standard
    size: 1Gi
    annotations:
      helm.sh/resource-policy: keep
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: default
        orgId: 1
        folder: Narx Commerce
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/default
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://narx-monitoring-prometheus.monitoring.svc:9090
        isDefault: true
  startupProbe:
    httpGet:
      path: /api/health
      port: grafana
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 120
kube-state-metrics:
  podLabels: *id001
  resources:
    requests:
      cpu: 15m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  collectors:
  - cronjobs
  - daemonsets
  - deployments
  - endpointslices
  - horizontalpodautoscalers
  - ingresses
  - jobs
  - leases
  - limitranges
  - namespaces
  - networkpolicies
  - nodes
  - persistentvolumeclaims
  - persistentvolumes
  - poddisruptionbudgets
  - pods
  - replicasets
  - replicationcontrollers
  - resourcequotas
  - services
  - statefulsets
  - storageclasses
  - volumeattachments
  prometheus:
    monitor:
      http:
        honorLabels: true
        metricRelabelings:
        - sourceLabels:
          - namespace
          regex: commerce-(dev|qa|production)
          targetLabel: project
          replacement: narx-commerce
        - sourceLabels:
          - namespace
          regex: commerce-(dev|qa|production)
          targetLabel: environment
          replacement: ${1}
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi
