# The upstream Argo installation owns argocd-metrics. Only Prometheus may scrape its controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: narx-argocd-metrics-ingress
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: narx-commerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-application-controller
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8082
